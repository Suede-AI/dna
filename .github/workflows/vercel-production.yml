name: Vercel Production Deploy

# The Vercel GitHub App is not installed on the Suede-AI org, so this project
# cannot use Vercel's own Git integration. This workflow is the replacement:
# it is the only thing that should ever deploy dna.suedeai.ai.
#
# It runs after CI, not alongside it — the archive derives its public pages from
# data/rigs.json, so shipping a commit that fails validate-manifest would put
# wrong artist data on live URLs.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # workflow_run fires on every CI conclusion, including failure and cancelled.
    # Only a green run may ship. workflow_dispatch is the manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # These two identify which Vercel project to ship to. They are not
    # credentials: they do nothing without VERCEL_TOKEN, and the Vercel CLI
    # writes them in plain text to .vercel/project.json on any machine that runs
    # `vercel pull`. Holding them as secrets bought no protection and cost three
    # chances to half-populate the set, so they live here and VERCEL_TOKEN is the
    # only secret the deploy needs.
    env:
      VERCEL_ORG_ID: team_i3zcwXswG8Kcy4hJaBIKuAt6
      VERCEL_PROJECT_ID: prj_7Zxlwv6V6X0ZQ9TbySaGCyBsMJaj

    steps:
      # Fails the job when the token is missing. This used to set ready=false and
      # skip every step below, which made the workflow go green while shipping
      # nothing — main sat undeployed and the Actions tab said everything passed.
      # A deploy workflow that cannot deploy is a failure, not a skip.
      - name: Check for deploy credentials
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            {
              echo "### Deploy failed: missing credentials"
              echo
              echo "VERCEL_TOKEN is not set on this repository."
              echo
              echo "dna.suedeai.ai cannot be deployed until it exists. Until then"
              echo "every commit to main stays unpublished."
              echo
              echo "Settings -> Secrets and variables -> Actions, then re-run this"
              echo "workflow. It has to be a repository secret. An environment secret"
              echo "is not visible to this job, and the environment variables page in"
              echo "the Vercel dashboard is a different thing that has no effect here."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::missing deploy secret: VERCEL_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip by default, which may
          # already have moved past the commit CI just proved green. Pin to the
          # exact SHA that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the Vercel project's runtime (24.x). CI builds on 20 to catch
          # compatibility problems; the artifact we actually ship must be built on
          # the version production runs.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        run: npx vercel@59 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx vercel@59 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          # The CLI writes progress banners alongside the URL; the URL is the last line.
          url=$(npx vercel@59 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" | tail -1)
          [ -n "$url" ] || { echo "::error::deploy produced no URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to production"
            echo
            echo "- commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- deployment: $url"
            echo "- live: https://dna.suedeai.ai"
          } >> "$GITHUB_STEP_SUMMARY"

      # A 200 proves the host answers, not that it answers with THIS build — the
      # site returned 200 all the way through the period when main was never
      # being deployed at all. Next chunk filenames are content-hashed, so the
      # production domain and the deployment we just created must reference the
      # same set once the alias has moved.
      - name: Verify production is serving this build
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
            --retry-all-errors https://dna.suedeai.ai)
          echo "dna.suedeai.ai -> $code"
          [ "$code" = "200" ] || { echo "::error::dna.suedeai.ai returned $code after deploy"; exit 1; }

          chunks() {
            curl -sS --retry 3 --retry-delay 3 --retry-all-errors "$1" \
              | grep -oE '/_next/static/chunks/[A-Za-z0-9._-]+\.js' | sort -u
          }
          live=$(chunks https://dna.suedeai.ai)
          fresh=$(chunks "$DEPLOY_URL")

          if [ -z "$fresh" ]; then
            echo "::warning::could not read assets from $DEPLOY_URL; freshness not verified"
            exit 0
          fi
          if [ "$live" = "$fresh" ]; then
            echo "production is serving the deployment just built"
            exit 0
          fi
          echo "::error::dna.suedeai.ai is not serving $DEPLOY_URL - the alias did not move"
          diff <(echo "$live") <(echo "$fresh") || true
          exit 1
